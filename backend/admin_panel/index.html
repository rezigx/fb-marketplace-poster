<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB Poster — Admin Panel</title>
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --border:#2a2e3a; --text:#e6e8ee; --muted:#8a90a0; --accent:#4f8cff; --green:#2ecc71; --red:#e74c3c; --amber:#f39c12; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  h1 { font-size:20px; }
  .token-box { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 14px; display:flex; gap:8px; align-items:center; }
  .token-box input { background:transparent; border:none; color:var(--text); width:200px; outline:none; font-size:13px; }
  .btn { background:var(--accent); border:none; color:#fff; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  .btn:hover { opacity:.9; }
  .btn.small { padding:5px 10px; font-size:12px; }
  .btn.green { background:var(--green); color:#08130b; }
  .btn.red { background:var(--red); }
  .table-wrap { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.active { background:rgba(46,204,113,.15); color:var(--green); }
  .badge.inactive { background:rgba(231,76,60,.15); color:var(--red); }
  .badge.expired { background:rgba(243,156,18,.15); color:var(--amber); }
  .key { font-family:ui-monospace,monospace; font-size:12px; color:var(--muted); }
  .muted { color:var(--muted); }
  .actions { display:flex; gap:6px; }
</style>
</head>
<body>
  <div class="header">
    <h1>FB Poster — Admin Panel</h1>
    <div class="token-box">
      <span class="muted">Token</span>
      <input id="token" type="password" placeholder="paste admin token">
      <button class="btn" onclick="loadCustomers()">Load</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Phone</th><th>License Key</th>
          <th>Status</th><th>Expires</th><th>Created</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="8" class="muted">Enter your admin token and click Load.</td></tr></tbody>
    </table>
  </div>

<script>
const tokenInput = document.getElementById('token');
const rowsEl = document.getElementById('rows');

function getToken() { return tokenInput.value.trim(); }

async function api(path, method='GET', body=null) {
  const headers = { 'Authorization': 'Bearer ' + getToken() };
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : null });
  if (!res.ok) { alert('Error ' + res.status + ': ' + (await res.text())); throw new Error(res.status); }
  return res.json();
}

function badge(status) {
  const map = { active:'active', inactive:'inactive', expired:'expired' };
  const cls = map[status] || 'inactive';
  return '<span class="badge ' + cls + '">' + status + '</span>';
}

async function loadCustomers() {
  rowsEl.innerHTML = '<tr><td colspan="8" class="muted">Loading...</td></tr>';
  try {
    const list = await api('/api/customers');
    if (!list.length) { rowsEl.innerHTML = '<tr><td colspan="8" class="muted">No customers yet.</td></tr>'; return; }
    rowsEl.innerHTML = list.map(c => `
      <tr>
        <td>${c.id}</td>
        <td>${c.name || ''}</td>
        <td>${c.phone || ''}</td>
        <td class="key">${c.license_key}</td>
        <td>${badge(c.status)}</td>
        <td>${c.expires_at || '—'}</td>
        <td class="muted">${c.created_at || ''}</td>
        <td class="actions">
          <button class="btn green small" onclick="activate(${c.id})">Activate 30d</button>
          <button class="btn red small" onclick="deactivate(${c.id})">Deactivate</button>
        </td>
      </tr>`).join('');
  } catch(e) { rowsEl.innerHTML = '<tr><td colspan="8" class="muted">Failed to load. Check token.</td></tr>'; }
}

async function activate(id) {
  const days = prompt('How many days?', '30');
  if (!days) return;
  try { await api('/api/activate', 'POST', { customer_id: id, duration_days: parseInt(days) }); loadCustomers(); }
  catch(e) {}
}

async function deactivate(id) {
  if (!confirm('Deactivate customer #' + id + '?')) return;
  try { await api('/api/deactivate', 'POST', { customer_id: id }); loadCustomers(); }
  catch(e) {}
}
</script>
</body>
</html>
